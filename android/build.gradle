// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // 关掉 Lint：它解析依赖时会联网向 Google 的 Maven 索引请求 package manifests，
    // 本机到 dl.google.com 不通，卡在 "Still waiting for package manifests to be
    // fetched remotely." 上二三十分钟不动，release 构建因此永远出不来。
    // Lint 只做静态检查，不影响产物正确性；需要检查时加 -PenableLint 单独跑。
    tasks.configureEach {
        if (name.startsWith("lint")) {
            enabled = project.hasProperty("enableLint")
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
