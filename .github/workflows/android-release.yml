name: Android Release

# Android 出包：Web 产物 → Capacitor 同步 → 签名 → APK / AAB。
#
# 触发方式三种：
#   1. 推 release/x.y.z 分支（正式发版，分支名必须等于 package.json 的版本）
#   2. 打 v* 标签（兼容旧流程，标签必须等于 package.json 的版本）
#   3. 手动 workflow_dispatch：可以顺手涨版本号 + 打标签（见 bump 输入），
#      等于「一键发版」—— 涨版本、CI 校验、出包、建 Release 全在这一个 job 里跑完。
#
# 为什么手动这条不靠「推标签去触发另一个 workflow」：用 GITHUB_TOKEN 推的提交/标签
# 不会触发新的 workflow（GitHub 的递归限制），所以那条路必须自带出包步骤才走得通。
# 反过来，用 PAT 推标签时本 workflow 会照旧被标签触发 —— 两条路互不干扰。
#
# 与 npm script 的关系：`npm run cap:sync:android` = `build:capacitor` + `cap sync android`，
# 一条命令把「构建前端」和「同步进 android/app/src/main/assets/public」都做了 ——
# 这两步必须连着跑，**只打包不 build+同步，打出来的就是上一版的前端**（踩过）。

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      bump:
        description: '涨版本号并打标签（none = 用当前 package.json 的版本号出包）'
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      build_bundle:
        description: 'Also build the Play Store bundle (AAB)'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Publish / attach to a GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  # 出包跑一次要十几分钟，别让后一次推送把正在跑的掐掉：掐掉等于白等一轮。
  cancel-in-progress: false

jobs:
  build-android:
    name: Build signed Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # vite 构建这棵树在默认堆上限下偶发 OOM；CI runner 有 7GB，给到 6GB 留点余量。
      NODE_OPTIONS: --max-old-space-size=6144
      # 2 核 runner：守护进程与并行执行只会让 transform 阶段跟自己抢内存，直接关掉。
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # 与 ci.yml 用同一把 key：这棵树 1.4GB（onnxruntime-node 原生库 285MB +
      # electron 43 的 dist 313MB），冷启动 npm ci 要五分钟，命中缓存直接省掉。
      # 见 ci.yml 里关于缓存作用域的说明。
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-ubuntu-latest-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Bump version
        id: bump
        # 只在手动出包且明确选了 bump 时涨版本。标签触发那条路上 package.json 已经是目标版本，
        # 再动一次就和标签对不上了。
        #
        # 必须在构建之前涨：vite 的 __APP_VERSION__、gradle 的 versionName / versionCode
        # 都是从这个文件读的，涨晚了打出来的包还是旧版本号。
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          npm version "$BUMP" --no-git-tag-version
          VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          echo "本次出包版本：v${VERSION}（versionCode 由它推出，见 android/app/build.gradle）"

      - name: Verify release ref matches package.json
        # 标签或 release/ 分支都代表一次发版；versionName / versionCode 全从 package.json 读，
        # 两边对不上，发出去的包版本就是错的。直接 fail，别让它安静地打完。
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        run: |
          set -euo pipefail
          VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            EXPECTED="v${VERSION}"
          else
            EXPECTED="release/${VERSION}"
          fi
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]]; then
            echo "::error::${GITHUB_REF_NAME} 与 package.json 的版本对不上，应为 ${EXPECTED}"
            exit 1
          fi
          echo "发版 ref 与 package.json 一致：${GITHUB_REF_NAME}"

      - name: Check version policy
        # 平台依赖钉死、Docker 部署同版本、Node 版本一致、锁文件与 package.json 同步。
        run: npm run check:versions

      - name: Run typecheck
        # 出包前先过一遍类型检查：标签可以随手推，PR 的门禁不一定覆盖得到，
        # 而 vite build 与 gradle 都不做类型检查 —— 那类错误要一路走到运行时才炸。
        # 跑 1 分多钟，换掉一次「装机才发现」是值的。
        run: npm run typecheck

      - name: Run unit tests
        # 同上：出包前的最后一道门禁，坏逻辑不打包。
        run: npm run test:unit

      # Capacitor 7 的 android 库以 source/target 21 编译，JDK 17 会直接报
      # 「无效的源发行版：21」。必须是 21 或更高。
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/variables.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android analysis weights
        # 182MB 的两份 ONNX 不进 git。缓存命中时 `npm run models:android` 只做一次
        # sha256 校验；没命中才去 hf-mirror 下。key 跟脚本走：权重或校验值一改就重下。
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/models
          key: android-models-${{ hashFiles('scripts/fetchAndroidModels.mjs', 'android/app/src/main/java/top/izuna/foliamajor/automix/AutomixModels.kt') }}

      - name: Build web assets and sync to Android
        # 一条命令三件事：vite build（FOLIA_BUILD_TARGET=capacitor）+ 取分析权重 +
        # cap sync android。分开写容易漏掉同步那一步，而漏了之后打出来的包照样是绿的 ——
        # 只有装机才发现前端还是旧的；漏了权重则是装机后智能动感永远不动。
        run: npm run cap:sync:android

      - name: Restore signing keystore
        id: keystore
        # build.gradle 里的签名是**可选**的：没有 keystore.properties 就打未签名包。
        # 所以缺 secrets 不 fail，只警告并标记 signed=false —— 未签名的包装不上真机。
        # secrets 配了就当场验一遍：base64 解不开、口令或 alias 不对，都在这里失败，
        # 不要等到十几分钟后才发现打出来的是另一个签名的包。
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置 —— 本次产出的是**未签名**的 release 包"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > android/folia-release.jks
          test -s android/folia-release.jks || { echo "::error::keystore 解出来是空的（base64 不对？）"; exit 1; }
          # storeFile 相对 **app 模块** 目录解析（app/build.gradle 里的 file()），
          # 所以是 ../folia-release.jks 而不是 folia-release.jks。
          cat > android/keystore.properties <<EOF
          storeFile=../folia-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          keytool -list -keystore android/folia-release.jks -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" >/dev/null \
            || { echo "::error::keystore 口令或 alias 与 secrets 不符"; exit 1; }
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "签名配置已写入（keystore 已恢复并校验）"

      - name: Build release APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Build release bundle (AAB)
        if: github.event_name == 'push' || inputs.build_bundle
        working-directory: ./android
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify packaged web assets
        # 只比 chunk 名不够，内容也要断言：改的是壁纸页时 bootstrap 的哈希根本不会变，
        # 上一次就差点因此漏判（详见本机 build-apk.sh 里的同一段注释）。
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "没有产出 APK"; exit 1; }
          unzip -l "$APK" | grep -E "assets/public/wallpaper\.html|assets/public/assets/bootstrap-.*\.js" \
            || { echo "Web 产物没进包 —— 大概率是 cap sync 那一步没跑"; exit 1; }
          unzip -p "$APK" "assets/public/assets/wallpaper-*.js" | grep -c "wallpaper-stage" \
            || { echo "壁纸页代码没进包"; exit 1; }

      - name: Verify APK signature
        # keystore 配错 = 打出来是另一个签名的包：装不上旧版，应用内更新也会被系统拒。
        # 直接对产物验签并比对证书指纹，比等用户装失败强。
        if: steps.keystore.outputs.signed == 'true'
        env:
          # folia-release.jks 里 folia 证书的 SHA-256（keytool -list -v 能看到）。
          # 换 keystore 时这里和 secrets 一起改；指纹是公开信息，不需要保密。
          EXPECTED_CERT_SHA256: 'BC:10:0C:6E:08:EA:C6:12:44:3D:9C:96:FC:72:9A:F4:48:FD:EC:8F:E0:D3:4A:AC:B8:04:1F:57:18:ED:50:DA'
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          [[ -n "${APKSIGNER}" ]] || { echo "::error::找不到 apksigner（ANDROID_HOME 未设置？）"; exit 1; }
          # apksigner 输出的是不带冒号的 BC100C…，keytool 输出的是带冒号的 BC:10:…：两边都去掉冒号再比。
          ACTUAL="$("${APKSIGNER}" verify --print-certs "$APK" | grep -i 'certificate SHA-256 digest' | head -1 | sed -E 's/.*digest: *//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="${EXPECTED_CERT_SHA256//:/}"
          echo "APK 签名证书 SHA-256：${ACTUAL}"
          [[ "${ACTUAL}" == "${EXPECTED}" ]] \
            || { echo "::error::APK 的签名证书与预期不一致（keystore 换过？secrets 配错？）"; exit 1; }

      - name: Remove signing material from the workspace
        # runner 是一次性的，但别把 keystore 留在工作区里给后面的步骤碰。
        if: always()
        run: rm -f android/folia-release.jks android/keystore.properties

      - name: Name artifacts by version
        id: name
        run: |
          set -euo pipefail
          VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # 标签触发时以标签为准（package.json 有可能忘了改），手动出包时用刚算出来的版本。
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist-android/folia-sonnet-${VERSION}-release.apk"
          if [[ -f android/app/build/outputs/bundle/release/app-release.aab ]]; then
            cp android/app/build/outputs/bundle/release/app-release.aab \
               "dist-android/folia-sonnet-${VERSION}-release.aab"
          fi
          ls -la dist-android

      - name: Commit version bump and push tag
        # 包已经出好、验过才动 git：构建失败就不该留下标签和提交。
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          TAG: ${{ steps.name.outputs.tag }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只加版本相关这两个文件：cap sync 会往 android/ 里塞构建产物，
          # 一记 git add -A 就会把它们一起提交进去。
          git add package.json
          # npm version 会顺手把版本写进 lock 文件，改了才一起提交。
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
          fi
          git commit -m "chore(release): ${TAG}"
          git tag "${TAG}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          git push origin "refs/tags/${TAG}"
          echo "已推送 ${TAG} —— 注意：GITHUB_TOKEN 推的标签不会再触发别的 workflow，"
          echo "桌面端（electron-release.yml）需要自己去 Actions 里手动跑一次。"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folia-android-${{ steps.name.outputs.version }}
          path: dist-android/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        # 打标签（或手动勾了发布、或手动涨了版本）才发。纯粹只想拿个包验证时
        # 选 bump=none + 不勾发布，Releases 页不会被污染。
        if: github.event_name == 'push' || inputs.publish_release || inputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.name.outputs.tag }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Folia ${VERSION}" --generate-notes
          fi
          gh release upload "$TAG" dist-android/* --clobber
