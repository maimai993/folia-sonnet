name: CI

# 安卓项目的守门 CI：类型检查、单测、版本约束、密钥检查、UI 门禁。
# 检查逻辑都在仓库根目录的 ci/（见 ci/README.md），这个文件只做组装。
# APK/AAB 出包在 android-release.yml，不在这里重复跑。
#
# 本 fork 只出安卓包：上游的 build-web（web 打包冒烟）与 typecheck-sync-server
# （Node 部署的后端）都删了 —— web 产物在 android-release.yml 里经
# build:capacitor 照样会编一遍，sync-server 不在这条发布链上。
#
# dev 和 main 上也跑一次，唯一目的是把 node_modules 缓存写进 base 分支的 scope。Actions 的缓存
# 作用域规则是「PR 能读 base 分支的缓存，分支之间互相不可见」，而这个 workflow 原本只在
# pull_request 触发，于是缓存只会写进各个 PR 自己的 scope 并随 PR 合并作废——每个新分支、
# 每个 fork PR 的首跑都必然冷启动装 1.4GB 依赖。

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    # 只有发向 dev / main 的 PR 才算数，别处开的 PR 不跑。
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # main 上不抢占：那一跑是为了落缓存，被后一次推送掐掉就白跑了。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-unit:
    name: Run unit tests
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # 缓存 node_modules 本身而不是 ~/.npm：这棵树有 1.4GB（onnxruntime-node 的原生库 285MB、
      # electron 43 自带的 dist 313MB，两者都在 tarball 里，没有可跳过的 install script），
      # 而 npm ci 在 ~/.npm 命中的情况下仍然量到过 5 分钟，瓶颈是 1169 个包的解包落盘而不是下载。
      # setup-node 的 cache: npm 与这里用同一个 lockfile hash 做 key，命中/落空完全同步，留着纯属
      # 多下一份，所以上面没有开。
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-ubuntu-latest-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

  version-policy:
    name: Version policy
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # 不需要 npm ci：只读仓库里的 package.json、.nvmrc、workflow 文件。
      - name: Check version policy
        run: npm run check:versions

  secret-guard:
    name: Secret guard
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # 不需要 npm ci：只读 .env.example 与源码，Node 24 直接跑 ci/checkSecrets.ts。
      - name: Scan sources for secrets
        run: node ci/checkSecrets.ts

  ui-gates:
    name: UI gates
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # 不需要 npm ci：只读 src/ 里的源码。
      - name: Control library policy
        run: npm run check:ui

      - name: File size policy
        run: npm run check:size
