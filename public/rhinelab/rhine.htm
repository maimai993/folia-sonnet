    <script>
      /*
       * Folia 侧的策略桥。补丁脚本把入口挂在 window 上，这里只做消息转发 ——
       * 用普通 script 而不是 module，保证它先于 bundle 执行（module 天生 defer）。
       */
      window.addEventListener('message', function (event) {
        var data = event && event.data;
        if (!data) return;
        if (data.type === 'rhine-policy') {
          try {
            window.__FOLIA_RHINE_SET__(data.policy);
          } catch (error) {
            console.warn('[rhine] 应用渲染策略失败', error);
          }
          return;
        }
        if (data.type === 'rhine-overlay') {
          try {
            window.__FOLIA_OVERLAY_SET__(data.overlay);
          } catch (error) {
            console.warn('[rhine] 应用可视化叠层失败', error);
          }
        }
      });
    </script>
