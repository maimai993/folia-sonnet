<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="QQ Music alternative icon">
  <defs>
    <linearGradient id="music-gradient" x1="8" y1="7" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2588FF"/>
